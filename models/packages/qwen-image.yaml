---
# Qwen-Image — 20B text-to-image, fp8, with the 4-step Lightning LoRA.
#
# This package is the source of truth for the `models:` section of the
# repository's comfy-lock.yaml, which is generated from it by
# services/fetch/emit-comfy-lock.sh and checked in CI.
#
# comfy-lock records WHERE TO GET a file. A package additionally records WHAT
# SHOULD ARRIVE, so a fetch can be verified rather than trusted. A
# wrong-but-plausible model file is worse than a missing one: it renders subtly
# wrong images with no error anywhere.
#
# Every sha256 here was resolved from the HuggingFace `x-linked-etag` header of
# the FIRST hop. Not from the redirect chain -- the final ETag there is the CDN's
# Xet content-address, a different value entirely, and using it would have
# written four wrong hashes into this file.
package: qwen-image
version: 1
updated: '2026-09-01'
status: active
description: >-
  Qwen-Image 20B text-to-image in fp8, with its required text encoder and VAE,
  plus the optional 4-step Lightning LoRA.

models:
  - name: qwen-image
    role: diffusion_model
    install: models/diffusion_models/
    note: >-
      The 20B base model. Requires the text encoder and VAE below; neither is
      interchangeable with another model line's.
    files:
      - path: diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors
        sha256: 5dc80554d5d83390046a2f4a94ece06afb7700bf7b0aaf8bde9769793875876b
        size_bytes: 20430679144
        sources:
          - kind: huggingface_canonical
            url: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/resolve/main/split_files/diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors
            ref: Comfy-Org/Qwen-Image_ComfyUI#split_files/diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors
            verified: true

  - name: qwen-image-text-encoder
    role: text_encoder
    install: models/text_encoders/

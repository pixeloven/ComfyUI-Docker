# comfy.yaml — the human-authored manifest. Declares INTENT.
#
# comfy-lock.yaml records the RESOLUTION: exact commits, exact URLs, exact
# hashes. Manifest is edited; lock is generated by services/fetch/resolve.sh;
# fetch reads the lock.
#
# Scope today is models. custom_nodes / workflows / config slot in as sibling
# top-level keys when we get there -- comfy-lock already has a custom_nodes
# section to resolve into.
name: pixeloven-comfyui
description: Default model set for the ComfyUI images.

# Host -> the environment variable holding that host's credential.
#
# Credentials are resolved by the URL's HOST, so no model entry ever carries an
# auth field -- which is why `models[]` in the lock stays exactly comfy-cli's
# documented shape. Values MUST be ${ENV_VAR} references; the schema rejects a
# literal, so a token cannot be committed by accident.
auth:
  civitai.com: ${CIVITAI_TOKEN}
  huggingface.co: ${HF_TOKEN}
  github.com: ${GITHUB_TOKEN}

models:
  - name: qwen-image
    description: Qwen-Image 20B text-to-image, fp8, with its text encoder and VAE.
    files:
      - source: hf:Comfy-Org/Qwen-Image_ComfyUI
        file: split_files/diffusion_models/qwen_image_2512_fp8_e4m3fn.safetensors
        install: models/diffusion_models/
        type: diffusion_model

      - source: hf:Comfy-Org/Qwen-Image_ComfyUI
        file: split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
        install: models/text_encoders/
        type: text_encoder

      - source: hf:Comfy-Org/Qwen-Image_ComfyUI
        file: split_files/vae/qwen_image_vae.safetensors
        install: models/vae/
        type: vae

  - name: qwen-image-lightning
    description: Step-distilled LoRA rendering Qwen-Image in 4 steps. Optional.
    files:
      - source: hf:lightx2v/Qwen-Image-Lightning
        # `revision` is the unresolved intent -- a moving ref the lock pins to a
        # commit. This is the `^18` -> `18.3.1` moment.
        revision: main
        file: Qwen-Image-Lightning-4steps-V1.0.safetensors
        install: models/loras/
        type: lora

  - name: real-esrgan
    description: >-
      Upscalers published as GitHub release assets. GitHub only computes a
      digest for newer uploads, and these date from 2021 -- so the hash is
      stated here and resolve.sh uses it rather than downloading 67 MB to
      discover it. Omit `sha256` and it will download and hash instead.
    files:
      - source: gh:xinntao/Real-ESRGAN@v0.1.0
        file: RealESRGAN_x4plus.pth
        sha256: 4fa0d38905f75ac06eb49a7951b426670021be3018265fd191d2125df9d682f1
        install: models/upscale_models/
        type: upscale_model

# Named sets to resolve together. A member is a model `name` above, or another
# profile -- so `everything` below is set union, which is the "sometimes I want
# both" case without inheritance, overrides or diamonds.
#
# Models shared between profiles are defined ONCE here. They appear in both
# locks, and materialising both installs them once: the fetch is
# content-addressed, so the second pass sees a matching sha256 and skips.
#
#   resolve.sh comfy.yaml --profile image > locks/image.yaml
#
# Without --profile, every model is resolved -- which is what comfy-lock.yaml is.
profiles:
  image:      [qwen-image, real-esrgan]
  image-fast: [qwen-image, qwen-image-lightning, real-esrgan]
  everything: [image-fast]

  # Civitai needs a token at fetch time, resolved from the `auth` map above by
  # host. `as` is required for civitai sources: the filename comes from the API,
  # so without it the install path is not knowable offline and check-lock.sh
  # could not run without network.
  # - name: some-finetune
  #   files:
  #     - source: civitai:1683398
  #       as: MysticXXX-v6.safetensors
  #       install: models/checkpoints/
  #       type: checkpoint

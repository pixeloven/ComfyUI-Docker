# One claim per volume root in the runtime contract. No storageClassName, so
# each uses the cluster's default StorageClass. The sizes are starting points:
# a model store alone often needs far more than 100Gi.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: comfyui-models
  labels:
    app.kubernetes.io/name: comfyui
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
---

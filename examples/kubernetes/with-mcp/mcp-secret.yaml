# OPT-IN, with mcp-sidecar.patch.yaml beside it (README.md, "Adding the MCP
# Sidecar"). `kubectl apply -f examples/kubernetes/` doesn't apply this file.
#
# A PLACEHOLDER. The simplest way is not to apply this file at all, and to
# create the Secret directly:
#
#   kubectl create secret generic comfyui-mcp \
#     --from-literal=COMFYUI_MCP_HTTP_TOKEN="$(openssl rand -hex 32)"
#
# To apply it instead, replace the value with the output of
# `openssl rand -hex 32` first, and don't commit the real one. The placeholder
# is deliberately too short: left as it is, the sidecar refuses to start (a
# token needs at least 32 characters) and says why.
apiVersion: v1
kind: Secret
metadata:
  name: comfyui-mcp
  labels:
    app.kubernetes.io/name: comfyui
type: Opaque
stringData:
  COMFYUI_MCP_HTTP_TOKEN: REPLACE-ME

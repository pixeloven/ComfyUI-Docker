# OPTIONAL, with the `mcp` sidecar in deployment.yaml: delete both if you don't
# use an MCP client.
#
# A PLACEHOLDER. Replace the value before you apply it, and don't commit the
# real one. Generate a token with:
#
#   openssl rand -hex 32
#
# Or delete this file and create the Secret directly:
#
#   kubectl create secret generic comfyui-mcp \
#     --from-literal=COMFYUI_MCP_HTTP_TOKEN="$(openssl rand -hex 32)"
#
# The placeholder is deliberately too short: left as it is, the sidecar
# refuses to start (a token needs at least 32 characters) and says why.
apiVersion: v1
kind: Secret
metadata:
  name: comfyui-mcp
  labels:
    app.kubernetes.io/name: comfyui
type: Opaque
stringData:
  COMFYUI_MCP_HTTP_TOKEN: REPLACE-ME

name: CI

on:
  push:
    branches: [ main ]
    tags:
      # ONE release line. `v1.2.3` publishes everything this repo produces --
      # the ComfyUI images, the mcp images, the comfyctl image, the comfyctl
      # wheel, and the skills plugin -- from one commit, in one GitHub Release.
      #
      # There used to be two lines, and a `comfyfetch/v*` tag published only the
      # CLI. The result was a releases page where neither entry described the
      # repo and GitHub labelled whichever shipped last as "Latest" -- so the
      # fetch CLI's 0.2.0 appeared to supersede the images' 0.1.0. Consumers
      # cannot be expected to reverse-engineer that.
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild without cache'
        required: false
        type: boolean
        default: false

# A new push to a PR makes the previous run obsolete, so cancel it. Never on
# main or a tag -- those publish artifacts consumers pin by sha.
#
# `cancel-in-progress: false` is NOT enough to say that, and the comment that
# used to sit here claimed it was. It protects a run that is already executing,
# but GitHub keeps only ONE pending run per group and cancels older pending
# ones. Merging #69 then #70 half an hour apart did exactly that: 0ce4ab48's
# publish sat queued for 31 minutes and died the moment the next merge arrived,
# so `core:cuda-0ce4ab48` does not exist. Giving every non-PR ref its own group
# is what actually makes the guarantee -- nothing ever queues behind anything.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which parts of the repo a change touches. The expensive image builds are
  # ~60 of the ~62 minutes a full run costs, and most changes cannot affect
  # them: every one of the fetch-tooling PRs built the CUDA and XPU stacks for
  # nothing.
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.filter.outputs.images }}
      comfyctl: ${{ steps.filter.outputs.comfyctl }}
      relay: ${{ steps.filter.outputs.relay }}
      bake: ${{ steps.filter.outputs.bake }}
      examples: ${{ steps.filter.outputs.examples }}
    steps:
    - uses: actions/checkout@v7.0.1
    # Pinned to an exact semver tag, like every other action here -- a version
    # is something a human can read, compare and reason about upgrading; a
    # commit sha is not. Dependabot proposes the bumps. It is used rather
    # than a hand-rolled `git diff` because the awkward cases -- PR merge-base,
    # first push to a branch, force-push -- are exactly where a hand-rolled
    # version silently matches nothing and SKIPS a build that should have run.
    - uses: dorny/paths-filter@v4.0.3
      id: filter
      with:
        filters: |
          images:
            - 'services/comfy/**'
            - 'services/runtime/**'
            - 'docker-bake.hcl'
            - '.github/workflows/ci.yml'
          comfyctl:
            - 'services/comfyctl/**'
            - 'docker-bake.hcl'
            - 'services/pyproject.toml'
            - 'services/uv.lock'
            - 'comfy.yaml'
            - 'comfy-lock.yaml'
            - 'locks/**'
          # The mcp image (comfyrelay, since 5.0.0) installs both workspace
          # members from the one lock, so a change to either can break it. It
          # also indexes the guides in skills/ into its docs index (#134).
          relay:
            - 'services/comfyrelay/**'
            - 'services/comfyctl/**'
            - 'services/pyproject.toml'
            - 'services/uv.lock'
            - 'skills/**'
            - 'tests/relay/**'
            - 'docker-bake.hcl'
            - '.github/workflows/ci.yml'
          # The docs-pin job checks COMFY_DOCS_SHA whenever this file changes.
          bake:
            - 'docker-bake.hcl'
          examples:
            - 'examples/**'

  # Which release line this ref belongs to, and what to call what it builds.
  #
  # Both lines publish from this one workflow, and a tag push is an
  # `event_name: push` like any other -- so before this job existed a
  # `comfyfetch/v*` tag ran the CUDA, cuda-arch, CPU and accelerator builds,
  # every IMAGE_LABEL fell through its `|| 'latest'` branch, and the run
  # republished `core:cuda-latest` from a tag commit. That is the overwrite
  # PUBLISH_LATEST exists to prevent, bypassed because the label WAS `latest`.
  # It went the other way too: a `v*` tag rebuilt and pushed `fetch:latest`
  # (the image `comfyctl` replaced in 6.0.0).
  #
  # VERSIONING.md says the two lines move independently. This is where that
  # stops being a claim about intent.
  context:
    name: classify the ref
    runs-on: ubuntu-latest
    needs: changes
    outputs:
      image_version: ${{ steps.classify.outputs.image_version }}
      image_label: ${{ steps.classify.outputs.image_label }}
      comfyctl_version: ${{ steps.classify.outputs.comfyctl_version }}
      comfyctl_label: ${{ steps.classify.outputs.comfyctl_label }}
      build_images: ${{ steps.classify.outputs.build_images }}
      build_comfyctl: ${{ steps.classify.outputs.build_comfyctl }}
      build_relay: ${{ steps.classify.outputs.build_relay }}
      publish_latest: ${{ steps.classify.outputs.publish_latest }}
      comfyui_version: ${{ steps.classify.outputs.comfyui_version }}
      registry_url: ${{ steps.classify.outputs.registry_url }}
      commit_sha: ${{ steps.classify.outputs.commit_sha }}
    steps:
    - uses: actions/checkout@v7.0.1

    # The lock agrees with every pyproject.toml, or nothing publishes. Here rather
    # than only in validate-models because every publishing job needs this one:
    # the release job tolerates a SKIPPED publish-comfyctl, which is what a failed
    # validate-models produces.
    - uses: astral-sh/setup-uv@v10.0.1
    - name: services/uv.lock is current
      run: uv lock --check --directory services

    - id: classify
      env:
        IMAGES_CHANGED: ${{ needs.changes.outputs.images }}
        COMFYCTL_CHANGED: ${{ needs.changes.outputs.comfyctl }}
        RELAY_CHANGED: ${{ needs.changes.outputs.relay }}
      run: |
        set -euo pipefail

        release_version=""
        image_version=""
        comfyctl_version=""

        # The version lives in a file and the tag only selects it. A tag that
        # disagrees would ship 0.1.0 bytes as v0.2.0 with nothing downstream
        # able to tell -- so disagreement fails the run rather than publishing.
        #
        # Prereleases are rejected, not tolerated: `v1.2.3-rc1` matches the
        # trigger glob but no publish path, so it used to reach the build with
        # an empty version and quietly overwrite the stable tags.
        agree() {
          got="$1"; want="$2"; source="$3"; label="$4"
          if ! printf '%s' "$got" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::${label}${got} is not a release version. Prereleases are not published."
            exit 1
          fi
          if [ "$got" != "$want" ]; then
            echo "::error::tag ${label}${got} does not match ${source} (${want})"
            exit 1
          fi
          echo "version ${got} confirmed against ${source}"
        }

        case "${GITHUB_REF}" in
          refs/tags/v*)
            release_version="${GITHUB_REF#refs/tags/v}"
            # The tag is checked against VERSION only. The table below checks
            # every other file against VERSION on this same run, so together
            # they tie the tag to every file that states the version.
            agree "${release_version}" "$(tr -d '[:space:]' < VERSION)" VERSION v
            image_version="${release_version}"
            comfyctl_version="${release_version}"
            ;;
          refs/tags/*)
            echo "::error::tag ${GITHUB_REF#refs/tags/} is not a release (expected vX.Y.Z)"
            exit 1
            ;;
        esac

        # Every push, not just releases: drift found on the tag is drift found
        # too late. One repo, one number, and this is the ONE table of the files
        # that state it: a new versioned file is one row here.
        #
        # services/uv.lock is NOT a row: the `uv lock --check` step above fails
        # whenever the lock disagrees with a member's pyproject.toml, and those
        # are rows, so the lock is covered transitively.
        versions="$(python3 - <<'PY'
        import json, tomllib

        def toml(path):
            with open(path, "rb") as f:
                return tomllib.load(f)

        rows = {
            "services/comfyctl/pyproject.toml": lambda: toml("services/comfyctl/pyproject.toml")["project"]["version"],
            # Not a wheel, but the mcp image's server_info reports it.
            "services/comfyrelay/pyproject.toml": lambda: toml("services/comfyrelay/pyproject.toml")["project"]["version"],
            ".claude-plugin/plugin.json": lambda: json.load(open(".claude-plugin/plugin.json"))["version"],
            "package.json": lambda: json.load(open("package.json")).get("version", "<no version key>"),
        }
        for source, read in rows.items():
            print(f"{source}\t{read()}")
        PY
        )"
        declared="$(tr -d '[:space:]' < VERSION)"
        while IFS=$'\t' read -r source got; do
          if [ "${got}" != "${declared}" ]; then
            echo "::error::${source} is ${got} but VERSION is ${declared}; every artifact ships one version"
            exit 1
          fi
          echo "version ${got} confirmed in ${source}"
        done <<< "${versions}"

        # A label is a name a consumer can pin, so `latest` is never a fallback
        # here. Anything without a release version gets the commit sha, which is
        # always a true statement about what was built.
        commit_sha="${GITHUB_SHA:0:8}"
        image_label="${image_version:-${commit_sha}}"
        comfyctl_label="${comfyctl_version:-${commit_sha}}"

        main=false
        if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF}" = refs/heads/main ]; then
          main=true
        fi

        # A release builds EVERYTHING, from one commit. It is ~60 minutes and
        # it happens rarely; the alternative is a release whose images were
        # built from a different commit than its wheel, which is exactly the
        # kind of thing nobody can debug six months later.
        build_images=false
        build_comfyctl=false
        build_relay=false
        if [ -n "${release_version}" ]; then
          build_images=true
          build_comfyctl=true
          # The mcp image is comfyrelay (#136): a release probes it too.
          build_relay=true
        elif [ "${main}" = true ]; then
          build_images=true
          build_comfyctl=true
          build_relay=true
        else
          if [ "${IMAGES_CHANGED}" = true ]; then build_images=true; fi
          if [ "${COMFYCTL_CHANGED}" = true ]; then build_comfyctl=true; fi
          if [ "${RELAY_CHANGED}" = true ]; then build_relay=true; fi
        fi

        # What ComfyUI goes INSIDE. Read back out of docker-bake.hcl rather
        # than grepped, so this and the build cannot disagree about the pin.
        #
        # This used to be `gh api .../releases/latest`, which made a release
        # non-reproducible -- see the COMFYUI_VERSION comment in docker-bake.hcl.
        comfyui_version="$(docker buildx bake -f docker-bake.hcl --print core-cuda 2>/dev/null \
          | jq -r '.target["core-cuda"].args.COMFYUI_VERSION')"
        if [ -z "${comfyui_version}" ] || [ "${comfyui_version}" = null ]; then
          echo "::error::could not read COMFYUI_VERSION out of docker-bake.hcl"
          exit 1
        fi

        # A release has to name a concrete upstream release. `master` is a
        # moving ref: it would make the release mean something different a week
        # later, which is the whole failure this pin exists to stop.
        if [ -n "${image_version}" ] && \
           ! printf '%s' "${comfyui_version}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "::error::COMFYUI_VERSION is '${comfyui_version}'; a release must pin a concrete upstream version"
          exit 1
        fi
        repository_lower="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]' | sed 's/-docker//')"

        {
          echo "image_version=${image_version}"
          echo "image_label=${image_label}"
          echo "comfyctl_version=${comfyctl_version}"
          echo "comfyctl_label=${comfyctl_label}"
          echo "build_images=${build_images}"
          echo "build_comfyctl=${build_comfyctl}"
          echo "build_relay=${build_relay}"
          echo "publish_latest=${main}"
          echo "comfyui_version=${comfyui_version}"
          echo "registry_url=ghcr.io/${repository_lower}/"
          echo "commit_sha=${commit_sha}"
        } >> "${GITHUB_OUTPUT}"

        echo "images=${build_images} (label ${image_label}) comfyctl=${build_comfyctl} (label ${comfyctl_label}) mcp=${build_relay} (label ${image_label})"

  # The workflows themselves. This repo's expensive bugs have been shell bugs --
  # a yq escape change that processed 0 files and exited 0, an `A && B || C`
  # that is not if-then-else -- and every one of them lived in a `run:` block
  # nothing linted. actionlint runs shellcheck over those blocks.
  lint-workflows:
    name: workflows lint clean
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    - run: docker run --rm -v "$PWD":/repo -w /repo mirror.gcr.io/rhysd/actionlint:1.7.7 -color

  validate-examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Validate Example Configurations
      run: |
        for example in core-cpu core-gpu complete-gpu core-amd core-intel; do
          echo "Validating examples/$example..."
          cd examples/$example
          # Create temporary .env for validation
          cp .env.example .env
          # --profile models: the opt-in fetch service too, which is where an
          # undeclared network hid (#119).
          docker compose --profile models config --quiet
          cd ../..
        done

    # The Kubernetes example has no compose file. The same kubeconform image
    # (tag AND digest), flags and schema version as `make validate`, so a local
    # run and CI agree. Job permissions are tracked separately in #121.
    - name: Validate the Kubernetes example
      run: docker run --rm -v "$PWD":/repo:ro -w /repo ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e -strict -summary -kubernetes-version 1.36.4 -ignore-filename-pattern '\.patch\.yaml$' examples/kubernetes

    # The opt-in MCP sidecar (examples/kubernetes/with-mcp/) is a strategic
    # merge patch, which is not a resource on its own: validate the Deployment
    # it makes, merged offline with --local, as `make validate` does.
    - name: Validate the Kubernetes example with the MCP sidecar
      run: |
        set -euo pipefail
        kubectl patch --local -f examples/kubernetes/deployment.yaml --type strategic \
          --patch-file examples/kubernetes/with-mcp/mcp-sidecar.patch.yaml -o yaml \
          | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e -strict -summary -kubernetes-version 1.36.4 -

  test-bake-targets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Test Docker Bake targets
      run: |
        # Validate all expected targets exist in docker-bake.hcl
        docker buildx bake --file docker-bake.hcl --print | grep -q "core-cpu"
        docker buildx bake --file docker-bake.hcl --print | grep -q "core-cuda"
        docker buildx bake --file docker-bake.hcl --print | grep -q "runtime-cpu"
        docker buildx bake --file docker-bake.hcl --print | grep -q "runtime-cuda"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda-sm80"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda-sm86"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda-sm89"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda-sm90"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda-sm120"
        docker buildx bake --file docker-bake.hcl --print | grep -q "core-rocm"
        docker buildx bake --file docker-bake.hcl --print | grep -q "core-xpu"
        docker buildx bake --file docker-bake.hcl --print | grep -q "mcp"
        docker buildx bake --file docker-bake.hcl --print | grep -q "mcp-convert"
        docker buildx bake --file docker-bake.hcl --print | grep -q "comfyctl"

  # COMFY_DOCS_SHA must be a commit on Comfy-Org/docs `main` (#134, #136).
  # GitHub serves any commit in the repo's fork network by its SHA, so a SHA
  # from a fork would build just as well; the compare API tells them apart:
  # main is `ahead` of a commit on it, or `identical` to its tip. Reads one
  # public repo, so the workflow's token with read-only contents is enough.
  # It runs on every v* tag ref too, whatever the event (a tag push, or a
  # workflow_dispatch run at the tag), and `release` needs it: on a release ref
  # it must run, never skip, or `release` would silently not run. So its `if`
  # holds on any v* tag ref, whatever the path filter says.
  docs-pin:
    name: COMFY_DOCS_SHA is on Comfy-Org/docs main
    runs-on: ubuntu-latest
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.bake == 'true')
      || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Compare the pin with Comfy-Org/docs main
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        err="${RUNNER_TEMP}/docs-pin.err"
        if ! printed="$(docker buildx bake -f docker-bake.hcl --print mcp 2>"${err}")"; then
          echo "::error::docker buildx bake --print mcp failed, so COMFY_DOCS_SHA could not be read: $(cat "${err}")"
          exit 1
        fi
        sha="$(printf '%s' "${printed}" | jq -r '.target.mcp.args.COMFY_DOCS_SHA' 2>/dev/null || true)"
        if ! printf '%s' "${sha}" | grep -qE '^[0-9a-f]{40}$'; then
          echo "::error::could not read a 40-hex COMFY_DOCS_SHA out of docker-bake.hcl (got '${sha}')"
          exit 1
        fi
        if ! status="$(gh api "repos/Comfy-Org/docs/compare/${sha}...main" --jq .status 2>"${err}")"; then
          echo "::error::gh api repos/Comfy-Org/docs/compare/${sha}...main failed (a SHA GitHub doesn't know, or an API error): $(cat "${err}")"
          exit 1
        fi
        case "${status}" in
          ahead|identical) echo "COMFY_DOCS_SHA ${sha} is on Comfy-Org/docs main (${status})" ;;
          *) echo "::error::COMFY_DOCS_SHA ${sha} is not on Comfy-Org/docs main: main is '${status}' of it, not 'ahead' or 'identical'"
             exit 1 ;;
        esac

  validate-models:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true

    # 29 cases, replacing 11 shell ones. Network-marked cases hit real hosts on
    # purpose: neither the missing-auth bug nor the unencoded-URL bug they guard
    # against would have been caught by mocked HTTP.
    #
    # The gated-repo cases skip without HF_TOKEN rather than failing, so a
    # contributor without access still gets a green suite instead of a mystery.
    - name: Test suite
      working-directory: services
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # --locked: a stale lock fails here instead of being silently rewritten.
      run: uv run --locked pytest -q

    - name: Validate the manifest and the locks
      run: |
        # `comfyctl fetch check` validates the format now -- comfyctl bundles the
        # schemas, so there is exactly ONE definition of a valid manifest and
        # it is the one consumers get. The root schemas/ copy was deleted with
        # this change: two files with the same $id, and CI checking the stale
        # one, is worse than no schema check.
        uvx --from ./services/comfyctl comfyctl fetch check comfy.yaml comfy-lock.yaml
        for lock in locks/*.yaml; do
          uvx --from ./services/comfyctl comfyctl fetch check comfy.yaml "$lock" \
            --profile "$(basename "${lock%.yaml}")" --parent comfy-lock.yaml
        done

    # OFFLINE, deliberately. Re-resolving would hit the network and would fail
    # whenever a moving `revision:` legitimately advanced upstream -- the one
    # case that is not a mistake.
    - name: Manifest and locks agree
      working-directory: services
      run: |
        uv run --locked comfyctl fetch check ../comfy.yaml ../comfy-lock.yaml
        uv run --locked comfyctl fetch check ../comfy.yaml ../locks/preview.yaml --profile preview

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    - name: Build the comfyctl image
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: comfyctl
        load: true
        push: false
      env:
        REGISTRY_URL: ghcr.io/pixeloven/comfyui/
        IMAGE_LABEL: ci

    # A real fetch through the image, not a --help probe: the entry points, the
    # interpreter and the network path all have to work together, and only this
    # exercises the published artifact rather than the source tree.
    - name: Verify the image fetches and verifies
      run: |
        set -eu
        work="$(mktemp -d)"; mkdir -p "$work/models"
        docker run --rm -u "$(id -u)" \
          -v "$PWD/locks:/locks:ro" -v "$work/models:/app/models" \
          ghcr.io/pixeloven/comfyui/comfyctl:ci fetch fetch /locks/preview.yaml /app --apply
        want=f0fb51dd10d41c26612c070fa0b52ea0215a5ff90792134b4971109dd713c019
        got="$(sha256sum "$work/models/vae_approx/taesd_decoder.safetensors" | cut -d' ' -f1)"
        [ "$got" = "$want" ] || { echo "FETCHED WRONG BYTES: $got"; exit 1; }
        docker run --rm -u "$(id -u)" \
          -v "$PWD/locks:/locks:ro" -v "$work/models:/app/models" \
          ghcr.io/pixeloven/comfyui/comfyctl:ci fetch fetch /locks/preview.yaml /app --apply \
          | grep -q '^present:     2' || { echo "NOT IDEMPOTENT"; exit 1; }
        echo "image ok: fetches the right bytes, and does nothing the second time"

  end-to-end:
    name: compose materialises models
    runs-on: ubuntu-latest
    needs: validate-models
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    - name: Build the comfyctl image
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: comfyctl
        load: true
        push: false
      env:
        REGISTRY_URL: ghcr.io/pixeloven/comfyui/
        IMAGE_LABEL: ci

    # The proof the rest of this job exists for: schema validation says the lock
    # is well-formed, and the image test says the fetcher works in isolation.
    # NEITHER catches a wiring problem -- and the first real run of this failed
    # with "destination not writable", because Docker creates a missing
    # bind-mount source as ROOT while the image runs non-root by design.
    #
    # Deliberately small: the `preview` lock is 9.5 MB of TAESD decoders, so
    # this runs on every PR in seconds rather than pulling a model set.
    - name: docker compose --profile models, into a real volume
      working-directory: examples/core-gpu
      env:
        COMFYCTL_IMAGE: ghcr.io/pixeloven/comfyui/comfyctl:ci
      run: |
        set -eu
        cp .env.example .env
        docker compose --profile models run --rm fetch

    - name: The files are on the host, at the paths ComfyUI reads
      working-directory: examples/core-gpu
      run: |
        set -eu
        sudo curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64
        sudo chmod 0555 /usr/local/bin/yq

        n=0
        while read -r path want; do
          n=$((n + 1))
          got="$(sha256sum "data/$path" | cut -d' ' -f1)"
          if [ "$got" != "$want" ]; then
            echo "HASH MISMATCH $path: got $got want $want"; exit 1
          fi
          echo "ok $path"
        done <<EOF
        $(yq -r '.models[] | .paths[0].path + " " + .hashes[0].hash' ../../locks/preview.yaml)
        EOF

        # Reading zero entries would make every assertion above vacuous.
        declared="$(yq -r '.models | length' ../../locks/preview.yaml)"
        if [ "$n" != "$declared" ]; then
          echo "checked $n files but the lock declares $declared"; exit 1
        fi

        # extra_model_paths.yaml declares base_path /app, and the lock's paths
        # are relative to that root -- so this is the join that has to hold.
        base="$(yq -r '.comfyui.base_path' extra_model_paths.yaml)"
        [ "$base" = "/app" ] || { echo "base_path moved to $base; the lock's paths assume /app"; exit 1; }

    - name: Re-running changes nothing
      working-directory: examples/core-gpu
      env:
        COMFYCTL_IMAGE: ghcr.io/pixeloven/comfyui/comfyctl:ci
      run: |
        docker compose --profile models run --rm fetch | tee /tmp/second.log
        grep -q '^present:     2' /tmp/second.log || { echo "NOT IDEMPOTENT"; cat /tmp/second.log; exit 1; }
        grep -q '^fetched:     0' /tmp/second.log || { echo "REFETCHED"; cat /tmp/second.log; exit 1; }

  publish-comfyctl:
    name: publish the comfyctl image
    runs-on: ubuntu-latest
    # Keeps the full gate: it publishes an artifact consumers pin by digest.
    needs: [context, validate-examples, test-bake-targets, validate-models, end-to-end]
    if: needs.context.outputs.build_comfyctl == 'true'
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7.0.1

    # No free-disk-space or prune step: this image is ~48 MB, not a CUDA stack.

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      id: build
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: comfyctl
        push: ${{ github.event_name == 'push' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        set: |
          *.cache-from=type=gha
          *.cache-to=type=gha,mode=max
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: ${{ needs.context.outputs.comfyctl_label }}
        PUBLISH_LATEST: ${{ needs.context.outputs.publish_latest }}
        COMFYCTL_VERSION: ${{ needs.context.outputs.comfyctl_version }}

    # Consumers pin by digest, so the digest has to be findable without digging
    # through logs. Harmony pins this one in a Job manifest.
    - name: Publish the digest to the job summary
      if: github.event_name == 'push'
      run: |
        {
          echo "### comfyctl image"
          echo ""
          echo "- tag: \`${{ needs.context.outputs.registry_url }}comfyctl:${{ needs.context.outputs.comfyctl_label }}\`"
          echo ""
          echo "Pin consumers by digest:"
          echo ""
          echo '```'
          docker buildx imagetools inspect \
            "${{ needs.context.outputs.registry_url }}comfyctl:${{ needs.context.outputs.comfyctl_label }}" \
            --format '{{println .Manifest.Digest}}' \
            | sed "s|^|${{ needs.context.outputs.registry_url }}comfyctl@|"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

  build-cuda:
    runs-on: ubuntu-latest
    needs: [context, test-bake-targets]
    if: needs.context.outputs.build_images == 'true'
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clean Docker Images
      run: |
        echo "🧹 Removing Docker system..."
        sudo docker system prune -af --volumes || true
        echo "✅ Docker system cleaned"
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
        buildkitd-flags: --debug
  
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Clear GitHub Actions cache (if force rebuild)
      if: github.event.inputs.force_rebuild == 'true'
      run: |
        echo "🧹 Clearing GitHub Actions cache..."
        gh cache delete --all || true
        echo "✅ Cache cleared"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Build CUDA images
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: cuda
        push: ${{ github.event_name == 'push' }}
        no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # No gha cache override here. docker-bake.hcl already declares a
        # REGISTRY cache for these targets, and the override replaced it with
        # the Actions cache -- which is capped at 10 GB per repo, while
        # `mode=max` pushes every intermediate layer of five multi-GB CUDA
        # images into it. It thrashes, evicts mid-build, and the next blob
        # fetch fails:
        #
        #   ERROR: target complete-cuda-sm90: failed to solve: failed to copy:
        #   GET https://productionresultssa10.blob.core.windows.net/actions-cache/...
        #
        # which is what killed the v1.0.0 release (sm86) and its retry (sm90).
        # The registry cache is unlimited and shared across runs.
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: ${{ needs.context.outputs.image_label }}
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}
        IMAGE_VERSION: ${{ needs.context.outputs.image_version }}
        PUBLISH_LATEST: ${{ needs.context.outputs.publish_latest }}

  build-cuda-arch:
    runs-on: ubuntu-latest
    needs: [context, build-cuda]
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clean Docker Images
      run: |
        echo "🧹 Removing Docker system..."
        sudo docker system prune -af --volumes || true
        echo "✅ Docker system cleaned"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
        buildkitd-flags: --debug

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build architecture-specific CUDA images
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: cuda-arch
        push: ${{ github.event_name == 'push' }}
        no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # No gha cache override here. docker-bake.hcl already declares a
        # REGISTRY cache for these targets, and the override replaced it with
        # the Actions cache -- which is capped at 10 GB per repo, while
        # `mode=max` pushes every intermediate layer of five multi-GB CUDA
        # images into it. It thrashes, evicts mid-build, and the next blob
        # fetch fails:
        #
        #   ERROR: target complete-cuda-sm90: failed to solve: failed to copy:
        #   GET https://productionresultssa10.blob.core.windows.net/actions-cache/...
        #
        # which is what killed the v1.0.0 release (sm86) and its retry (sm90).
        # The registry cache is unlimited and shared across runs.
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: ${{ needs.context.outputs.image_label }}
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}
        IMAGE_VERSION: ${{ needs.context.outputs.image_version }}
        PUBLISH_LATEST: ${{ needs.context.outputs.publish_latest }}

  # The mcp image: comfyrelay since 5.0.0 (#136). bake has declared the target
  # since #43, and VERSIONING.md counts it in the image family.
  #
  # It publishes only after the relay job has probed this commit's image
  # against a booted ComfyUI, so a commit whose server fails that never reaches
  # GHCR. What it pushes is its own build of the same commit, inputs and pins:
  # equivalent to the probed image, but not byte-identical to it. It runs
  # whenever the relay job does: on main, on a tag, and on a PR that touches
  # what the image installs (no push from a PR).
  #
  # No free-disk-space step: this is python:3.13-slim and one venv, not a CUDA
  # stack.
  build-mcp:
    runs-on: ubuntu-latest
    needs: [context, test-bake-targets, relay]
    if: needs.context.outputs.build_relay == 'true'
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the mcp image
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: mcp
        push: ${{ github.event_name == 'push' }}
        no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        set: |
          *.cache-from=type=gha
          *.cache-to=type=gha,mode=max
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: ${{ needs.context.outputs.image_label }}
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}
        IMAGE_VERSION: ${{ needs.context.outputs.image_version }}
        PUBLISH_LATEST: ${{ needs.context.outputs.publish_latest }}
        GIT_SHA: ${{ github.sha }}

  build-cpu:
    runs-on: ubuntu-latest
    needs: [context, test-bake-targets]
    if: needs.context.outputs.build_images == 'true'
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7.0.1
    
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clean Docker Images
      run: |
        echo "🧹 Removing Docker system..."
        sudo docker system prune -af --volumes || true
        echo "✅ Docker system cleaned"
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
        buildkitd-flags: --debug
  
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build CPU images
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: cpu
        push: ${{ github.event_name == 'push' }}
        no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # No gha cache override here. docker-bake.hcl already declares a
        # REGISTRY cache for these targets, and the override replaced it with
        # the Actions cache -- which is capped at 10 GB per repo, while
        # `mode=max` pushes every intermediate layer of five multi-GB CUDA
        # images into it. It thrashes, evicts mid-build, and the next blob
        # fetch fails:
        #
        #   ERROR: target complete-cuda-sm90: failed to solve: failed to copy:
        #   GET https://productionresultssa10.blob.core.windows.net/actions-cache/...
        #
        # which is what killed the v1.0.0 release (sm86) and its retry (sm90).
        # The registry cache is unlimited and shared across runs.
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: ${{ needs.context.outputs.image_label }}
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}
        IMAGE_VERSION: ${{ needs.context.outputs.image_version }}
        PUBLISH_LATEST: ${{ needs.context.outputs.publish_latest }}

  # Boot the image, not just build it. build-cpu pushes without loading and a
  # PR has no pushed tag to pull, so this builds core-cpu again with `load` and
  # runs tests/smoke/run.sh on it: root start with PUID/PGID 1001 (the Compose
  # path, the only one that runs the volume chown), /system_stats readiness,
  # UID/GID and ownership of all seven volume roots, and a GET /object_info
  # dump whose node classes are compared with the image main already
  # published. It tests our packaging, not ComfyUI, so no workflow runs.
  # `make smoke` is the same script locally.
  smoke-cpu:
    name: core-cpu boots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [context, test-bake-targets]
    if: needs.context.outputs.build_images == 'true'
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    # Never pushed: `push: false`, and the label is not one CI publishes.
    - name: Build core-cpu
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: core-cpu
        load: true
        push: false
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: smoke
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}

    # The node baseline is what main already published, never a file in the
    # repo: `core:cpu-<sha8>` of the commit this build is measured against,
    # falling back to `cpu-latest`. For a PR that is its merge-base with main;
    # for a push to main, the previous tip; for a tag, main's build of the
    # same commit. Same ComfyUI version: a missing node class fails. A pin
    # bump: the diff is reported (node-diff.md), not enforced. A baseline that
    # cannot be looked up or pulled fails; one that does not exist yet only
    # prints a notice.
    - name: Boot it, and compare node classes with main's image
      env:
        GH_TOKEN: ${{ github.token }}
        IMAGE: ${{ needs.context.outputs.registry_url }}core:cpu-smoke
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PR_HEAD: ${{ github.event.pull_request.head.sha }}
        BEFORE: ${{ github.event.before }}
      run: |
        set -euo pipefail
        case "${GITHUB_EVENT_NAME}:${GITHUB_REF}" in
          pull_request:*)
            commit="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PR_BASE}...${PR_HEAD}" --jq .merge_base_commit.sha)"
            why="merge-base with main" ;;
          push:refs/heads/main)
            commit="${BEFORE}"; why="main before this push" ;;
          *)
            commit="${GITHUB_SHA}"; why="main's build of this commit" ;;
        esac
        echo "baseline commit ${commit:0:8} (${why})"
        tests/smoke/run.sh \
          --baseline "${REGISTRY_URL}core:cpu-${commit:0:8}" \
          --baseline "${REGISTRY_URL}core:cpu-latest" \
          "$IMAGE"

    - name: Record the startup time and node diff
      if: always()
      run: |
        if [ -f tests/smoke/results/summary.json ]; then
          { echo '### core-cpu boot smoke'; echo '```json'; cat tests/smoke/results/summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ -f tests/smoke/results/node-diff.md ]; then
          cat tests/smoke/results/node-diff.md >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload the node schema and logs
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: smoke-cpu
        path: tests/smoke/results/
        if-no-files-found: warn
        retention-days: 14

  # The mcp image, comfyrelay (#131, #136). This job builds it and tests it;
  # build-mcp publishes it, and only after this has passed. The image's own
  # build already checks that it refuses to start without a token and passes a
  # probe with no ComfyUI. This boots a core-cpu and probes the image against it
  # for real, as UID 12345 on a read-only root filesystem, then times its
  # SIGTERM stop (`tests/relay/run.sh`, the same script locally). Then it runs the live
  # tests (*_live.py) against a fresh core-cpu: the only check that the relay
  # and a real ComfyUI agree (cancel, SIGTERM survival, /prompt errors), and
  # that the unit tests' FakeComfyUI behaves like the real one (#147). The
  # converter's live tests are relay-convert's, so nothing about mcp-convert
  # can hold back the mcp image.
  relay:
    name: comfyrelay probes a booted core-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [context, test-bake-targets]
    if: needs.context.outputs.build_relay == 'true'
    # Reads the repo and pulls public images; nothing here writes (#121).
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    # Never pushed: `push: false`, and `ci` is not a label CI publishes.
    - name: Build the mcp image
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: mcp
        load: true
        push: false
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: ci
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}
        GIT_SHA: ${{ github.sha }}

    # Which ComfyUI to test against: the core-cpu main already published, when
    # it holds the ComfyUI this commit pins. That is every run but a pin bump
    # (or a push to main that races build-cpu publishing one), and it costs one
    # manifest read. Otherwise the relay would meet the new ComfyUI only after
    # merge, so build core-cpu here from this commit, from the registry cache
    # the bake target declares: the runtime layers hit, and ComfyUI rebuilds.
    # Not smoke-cpu's image: handing ~5 GB between jobs costs more than the
    # build, and would put smoke-cpu on this job's critical path on every run.
    - name: Pick the core-cpu
      id: comfyui
      env:
        LATEST: ${{ needs.context.outputs.registry_url }}core:cpu-latest
        OWN: ${{ needs.context.outputs.registry_url }}core:cpu-relay
        PIN: ${{ needs.context.outputs.comfyui_version }}
      run: |
        set -euo pipefail
        published="$(docker buildx imagetools inspect "${LATEST}" \
          --format '{{index .Image.Config.Labels "org.opencontainers.image.version"}}')"
        if [ "${published}" = "${PIN}" ]; then
          echo "cpu-latest holds ComfyUI ${published}, the pin: testing against it"
          { echo "image=${LATEST}"; echo "build=false"; } >> "${GITHUB_OUTPUT}"
        else
          echo "::notice::cpu-latest holds ComfyUI ${published:-<no version label>} but this commit pins ${PIN}: building core-cpu here"
          { echo "image=${OWN}"; echo "build=true"; } >> "${GITHUB_OUTPUT}"
        fi

    # Never pushed, like smoke-cpu's: `push: false`, and `relay` is not a label
    # CI publishes.
    - name: Build core-cpu at this commit's pin
      if: steps.comfyui.outputs.build == 'true'
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: core-cpu
        load: true
        push: false
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: relay
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}

    - name: Probe it against a booted core-cpu
      env:
        COMFYUI_IMAGE: ${{ steps.comfyui.outputs.image }}
        RELAY_IMAGE: ${{ needs.context.outputs.registry_url }}mcp:ci
      run: |
        docker image inspect "${COMFYUI_IMAGE}" >/dev/null 2>&1 || docker pull -q "${COMFYUI_IMAGE}"
        tests/relay/run.sh --comfyui "${COMFYUI_IMAGE}" "${RELAY_IMAGE}"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1

    # On the runner, from the uv environment, as a contributor runs them: the
    # SIGTERM test starts `comfyctl relay serve` from it on a free loopback
    # port. ComfyUI is a fresh container, a scratch instance the tests may
    # write into, on the host network and bound to loopback, as
    # `run.sh --network host` boots it. No model or input file is needed: the
    # tests upload their own images. A skipped test fails the step, because
    # every test skipping (a lost URL) would otherwise pass green.
    - name: Run the live tests against a booted core-cpu
      timeout-minutes: 10
      working-directory: services
      env:
        COMFYUI_IMAGE: ${{ steps.comfyui.outputs.image }}
        LIVE_CONTAINER: comfyrelay-live-comfyui
        LIVE_PORT: 8188
        LIVE_OUT: ${{ github.workspace }}/tests/relay/results/live
      run: |
        set -euo pipefail
        mkdir -p "${LIVE_OUT}"
        docker run -d --name "${LIVE_CONTAINER}" --network host --security-opt no-new-privileges:true \
          -e COMFY_PORT="${LIVE_PORT}" -e COMFY_ENABLE_MANAGER=false -e "CLI_ARGS=--listen 127.0.0.1" \
          "${COMFYUI_IMAGE}" >/dev/null
        url="http://127.0.0.1:${LIVE_PORT}"
        start="$(date +%s)"
        until curl -fsS --max-time 10 "${url}/system_stats" >/dev/null 2>&1; do
          [ "$(docker inspect -f '{{.State.Running}}' "${LIVE_CONTAINER}")" = true ] \
            || { echo "::error::ComfyUI exited before /system_stats answered"; exit 1; }
          [ $(( $(date +%s) - start )) -lt 300 ] \
            || { echo "::error::ComfyUI did not answer /system_stats within 300s"; exit 1; }
          sleep 2
        done
        echo "ComfyUI (${COMFYUI_IMAGE}) answered after $(( $(date +%s) - start ))s"
        live=()
        for f in comfyrelay/tests/test_*_live.py; do
          [ "${f}" = comfyrelay/tests/test_relay_convert_live.py ] || live+=("${f}")
        done
        COMFYRELAY_LIVE_COMFYUI_URL="${url}" uv run --locked pytest -v -rs -o log_level=INFO \
          --junitxml "${LIVE_OUT}/junit.xml" "${live[@]}" 2>&1 | tee "${LIVE_OUT}/pytest.log"
        python3 - "${LIVE_OUT}/junit.xml" <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        suite = ET.parse(sys.argv[1]).getroot()
        suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
        ran, skipped = int(suite.get("tests")), int(suite.get("skipped"))
        if ran == 0 or skipped:
            sys.exit(f"::error::{skipped} of {ran} live tests skipped; every one must run against the booted ComfyUI")
        print(f"live tests: {ran} ran, none skipped")
        PY

    # The relay's own log is in pytest.log: captured at INFO for a failing
    # test, and the SIGTERM test puts its relay subprocess's output in its
    # assertion.
    - name: Keep the live ComfyUI's log
      if: always()
      env:
        LIVE_CONTAINER: comfyrelay-live-comfyui
        LIVE_OUT: tests/relay/results/live
      run: |
        docker container inspect "${LIVE_CONTAINER}" >/dev/null 2>&1 || exit 0
        mkdir -p "${LIVE_OUT}"
        docker logs "${LIVE_CONTAINER}" > "${LIVE_OUT}/comfyui.log" 2>&1 || true
        docker rm -f "${LIVE_CONTAINER}" >/dev/null 2>&1 || true

    - name: Record the probe
      if: always()
      run: |
        if [ -f tests/relay/results/summary.json ]; then
          { echo '### comfyrelay probe'; echo '```json'; cat tests/relay/results/summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        fi

    # With the live tests' in live/: ComfyUI's log, pytest's output (the
    # relay's log with it) and the JUnit report.
    - name: Upload the probe report and logs
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: relay
        path: tests/relay/results/
        if-no-files-found: warn
        retention-days: 14

  # mcp-convert (#167): comfyrelay with a headless Chromium, from the same
  # Dockerfile with RELAY_CONVERT=1. Its own job, apart from `relay`, so that
  # nothing about it (a stale apt pin, the Chromium download, a flaky browser
  # test) holds back the mcp image: build-mcp needs only `relay`, and
  # build-mcp-convert only this. The release needs both.
  #
  # It probes the image as `relay` does (tests/relay/run.sh, which gives a
  # converting image a tmpfs on /tmp and converts a template through it
  # against the frontend's own export from the same run), then runs the
  # converter's live tests (test_relay_convert_live.py: the lockdown with its
  # negative control, the allowlist, the oracle, a crashed tab) against a
  # fresh core-cpu, with the same Chromium build the image has, hash-checked.
  relay-convert:
    name: comfyrelay mcp-convert probes a booted core-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [context, test-bake-targets]
    if: needs.context.outputs.build_relay == 'true'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    # Never pushed: `push: false`, and `ci` is not a label CI publishes.
    - name: Build the mcp-convert image
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: mcp-convert
        load: true
        push: false
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: ci
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}
        GIT_SHA: ${{ github.sha }}

    # As `relay` picks it.
    - name: Pick the core-cpu
      id: comfyui
      env:
        LATEST: ${{ needs.context.outputs.registry_url }}core:cpu-latest
        OWN: ${{ needs.context.outputs.registry_url }}core:cpu-relay
        PIN: ${{ needs.context.outputs.comfyui_version }}
      run: |
        set -euo pipefail
        published="$(docker buildx imagetools inspect "${LATEST}" \
          --format '{{index .Image.Config.Labels "org.opencontainers.image.version"}}')"
        if [ "${published}" = "${PIN}" ]; then
          echo "cpu-latest holds ComfyUI ${published}, the pin: testing against it"
          { echo "image=${LATEST}"; echo "build=false"; } >> "${GITHUB_OUTPUT}"
        else
          echo "::notice::cpu-latest holds ComfyUI ${published:-<no version label>} but this commit pins ${PIN}: building core-cpu here"
          { echo "image=${OWN}"; echo "build=true"; } >> "${GITHUB_OUTPUT}"
        fi

    - name: Build core-cpu at this commit's pin
      if: steps.comfyui.outputs.build == 'true'
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: core-cpu
        load: true
        push: false
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: relay
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}

    - name: Probe mcp-convert, and convert a template through it
      env:
        COMFYUI_IMAGE: ${{ steps.comfyui.outputs.image }}
        RELAY_IMAGE: ${{ needs.context.outputs.registry_url }}mcp-convert:ci
      run: |
        docker image inspect "${COMFYUI_IMAGE}" >/dev/null 2>&1 || docker pull -q "${COMFYUI_IMAGE}"
        tests/relay/run.sh --comfyui "${COMFYUI_IMAGE}" "${RELAY_IMAGE}"

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1

    # The Chromium build the pinned Playwright names, as the image has it, and
    # checked the same way: its revision and the hash over its files, both read
    # from dockerfile.comfy.relay, since `playwright install` checks no hash.
    - name: Install the converter's browser
      working-directory: services
      run: |
        set -euo pipefail
        export PLAYWRIGHT_BROWSERS_PATH="${RUNNER_TEMP}/ms-playwright"
        uv run --locked --extra convert playwright install --with-deps --only-shell chromium
        rev="$(sed -n 's/^ARG CHROMIUM_REVISION=//p' comfyrelay/dockerfile.comfy.relay)"
        want="$(sed -n 's/^ARG CHROMIUM_TREE_SHA256=//p' comfyrelay/dockerfile.comfy.relay)"
        got="$(cd "${PLAYWRIGHT_BROWSERS_PATH}/chromium_headless_shell-${rev}/chrome-headless-shell-linux64" \
          && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
        if [ "${got}" != "${want}" ]; then
          echo "::error::chromium_headless_shell-${rev} hashes to ${got}, not ${want} (dockerfile.comfy.relay)"
          exit 1
        fi
        echo "chromium_headless_shell-${rev} matches its pinned hash"
        echo "PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH}" >> "${GITHUB_ENV}"

    # As `relay` runs its live tests, against a fresh core-cpu no browser has
    # opened, for the converter's alone. A skipped test fails the step.
    - name: Run the converter's live tests against a booted core-cpu
      timeout-minutes: 10
      working-directory: services
      env:
        COMFYUI_IMAGE: ${{ steps.comfyui.outputs.image }}
        LIVE_CONTAINER: comfyrelay-convert-live-comfyui
        LIVE_PORT: 8188
        LIVE_OUT: ${{ github.workspace }}/tests/relay/results/live
      run: |
        set -euo pipefail
        mkdir -p "${LIVE_OUT}"
        docker run -d --name "${LIVE_CONTAINER}" --network host --security-opt no-new-privileges:true \
          -e COMFY_PORT="${LIVE_PORT}" -e COMFY_ENABLE_MANAGER=false -e "CLI_ARGS=--listen 127.0.0.1" \
          "${COMFYUI_IMAGE}" >/dev/null
        url="http://127.0.0.1:${LIVE_PORT}"
        start="$(date +%s)"
        until curl -fsS --max-time 10 "${url}/system_stats" >/dev/null 2>&1; do
          [ "$(docker inspect -f '{{.State.Running}}' "${LIVE_CONTAINER}")" = true ] \
            || { echo "::error::ComfyUI exited before /system_stats answered"; exit 1; }
          [ $(( $(date +%s) - start )) -lt 300 ] \
            || { echo "::error::ComfyUI did not answer /system_stats within 300s"; exit 1; }
          sleep 2
        done
        echo "ComfyUI (${COMFYUI_IMAGE}) answered after $(( $(date +%s) - start ))s"
        COMFYRELAY_LIVE_COMFYUI_URL="${url}" uv run --locked --extra convert pytest -v -rs -o log_level=INFO \
          --junitxml "${LIVE_OUT}/junit.xml" comfyrelay/tests/test_relay_convert_live.py 2>&1 | tee "${LIVE_OUT}/pytest.log"
        python3 - "${LIVE_OUT}/junit.xml" <<'PY'
        import sys
        import xml.etree.ElementTree as ET

        suite = ET.parse(sys.argv[1]).getroot()
        suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
        ran, skipped = int(suite.get("tests")), int(suite.get("skipped"))
        if ran == 0 or skipped:
            sys.exit(f"::error::{skipped} of {ran} live tests skipped; every one must run against the booted ComfyUI")
        print(f"live tests: {ran} ran, none skipped")
        PY

    - name: Keep the live ComfyUI's log
      if: always()
      env:
        LIVE_CONTAINER: comfyrelay-convert-live-comfyui
        LIVE_OUT: tests/relay/results/live
      run: |
        docker container inspect "${LIVE_CONTAINER}" >/dev/null 2>&1 || exit 0
        mkdir -p "${LIVE_OUT}"
        docker logs "${LIVE_CONTAINER}" > "${LIVE_OUT}/comfyui.log" 2>&1 || true
        docker rm -f "${LIVE_CONTAINER}" >/dev/null 2>&1 || true

    - name: Record the probe
      if: always()
      run: |
        if [ -f tests/relay/results/summary.json ]; then
          { echo '### comfyrelay probe, mcp-convert'; echo '```json'; cat tests/relay/results/summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload the probe report and logs
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: relay-convert
        path: tests/relay/results/
        if-no-files-found: warn
        retention-days: 14

  # Publishes mcp-convert as build-mcp publishes mcp, with the same tags, and
  # only after relay-convert has probed this commit's image. It needs nothing of
  # build-mcp and build-mcp nothing of it, so neither can hold back the other.
  build-mcp-convert:
    runs-on: ubuntu-latest
    needs: [context, test-bake-targets, relay-convert]
    if: needs.context.outputs.build_relay == 'true'
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build the mcp-convert image
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: mcp-convert
        push: ${{ github.event_name == 'push' }}
        no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        set: |
          *.cache-from=type=gha,scope=mcp-convert
          *.cache-to=type=gha,mode=max,scope=mcp-convert
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: ${{ needs.context.outputs.image_label }}
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}
        IMAGE_VERSION: ${{ needs.context.outputs.image_version }}
        PUBLISH_LATEST: ${{ needs.context.outputs.publish_latest }}
        GIT_SHA: ${{ github.sha }}

  build-linux-accelerators:
    runs-on: ubuntu-latest
    needs: [context, test-bake-targets]
    if: needs.context.outputs.build_images == 'true'
    strategy:
      fail-fast: false
      matrix:
        target: [rocm, xpu]
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clean Docker Images
      run: |
        echo "🧹 Removing Docker system..."
        sudo docker system prune -af --volumes || true
        echo "✅ Docker system cleaned"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.3.0
      with:
        driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.6.0
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build ${{ matrix.target }} images
      uses: docker/bake-action@v7.3.0
      with:
        files: docker-bake.hcl
        targets: ${{ matrix.target }}
        push: ${{ github.event_name == 'push' }}
        no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        # No gha override: bake declares a REGISTRY cache for these, and the
        # Actions cache is capped at 10 GB per repo. See build-cuda-arch.
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
        IMAGE_LABEL: ${{ needs.context.outputs.image_label }}
        COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}
        IMAGE_VERSION: ${{ needs.context.outputs.image_version }}
        PUBLISH_LATEST: ${{ needs.context.outputs.publish_latest }}

  # The GitHub Release. Until this job existed the repo had semver, publish
  # paths and an agreement gate but zero tags and zero releases -- so a version
  # was a string in a file that no consumer could obtain.
  #
  # One release, everything in it: the digests of every image the run published,
  # the comfyctl wheel with its checksum and build provenance,
  # and notes from the changelog. A consumer should not have to assemble a release from parts.
  release:
    name: cut the release
    runs-on: ubuntu-latest
    needs: [context, validate-models, end-to-end, publish-comfyctl, build-cuda, build-cuda-arch, build-cpu, build-mcp, relay, build-mcp-convert, relay-convert, docs-pin, build-linux-accelerators, smoke-cpu]
    # `!contains(failure)` rather than the default all-succeeded: on a non-release
    # push some build jobs are legitimately `skipped` by the path filter, and
    # `skipped` is not `success`.
    #
    # But this job only runs for a release, which is a `v*` tag ref (pushed,
    # or a workflow_dispatch run at the tag), and there nothing it needs is
    # skipped legitimately: `context` forces build_images, build_comfyctl and
    # build_relay true (which relay-convert and build-mcp-convert run on, as
    # relay and build-mcp do), docs-pin's `if` holds on any v* tag ref whatever the
    # event, and validate-models, end-to-end and build-cuda-arch have no `if`.
    # So a `skipped` need here means an upstream failure hid it -- a failed
    # validate-models leaves publish-comfyctl skipped, not failed -- and every
    # need must have succeeded.
    #
    # This gates the GitHub Release only. On a tag the build jobs push their
    # images in parallel with smoke-cpu, so an image that fails it still
    # reaches the registry.
    if: >-
      !cancelled()
      && !contains(needs.*.result, 'failure')
      && (needs.context.outputs.image_version != '' || needs.context.outputs.comfyctl_version != '')
      && !contains(needs.*.result, 'skipped')
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE_VERSION: ${{ needs.context.outputs.image_version }}
      COMFYCTL_VERSION: ${{ needs.context.outputs.comfyctl_version }}
      REGISTRY_URL: ${{ needs.context.outputs.registry_url }}
      COMFYUI_VERSION: ${{ needs.context.outputs.comfyui_version }}
    steps:
    - uses: actions/checkout@v7.0.1

    - name: Releases are immutable
      run: |
        set -euo pipefail
        tag="${GITHUB_REF#refs/tags/}"
        if gh release view "$tag" >/dev/null 2>&1; then
          echo "::error::release ${tag} already exists. Releases are immutable -- cut a new version rather than replacing this one."
          exit 1
        fi
        echo "tag=${tag}" >> "$GITHUB_ENV"

    # Notes come from the changelog, so the release says what changed rather
    # than listing commits. A version with no dated section fails the release:
    # publishing notes headed `unreleased` is how a changelog stops being read.
    - name: Release notes, from the changelog
      run: |
        set -euo pipefail
        file=CHANGELOG.md; version="${IMAGE_VERSION}"; title="v${IMAGE_VERSION}"

        heading="$(grep -m1 -F "## ${version} " "${file}" || true)"
        if [ -z "${heading}" ]; then
          echo "::error::${file} has no '## ${version}' section. Add one before tagging."
          exit 1
        fi
        case "${heading}" in
          *unreleased*|*"never published"*)
            echo "::error::${file} still marks ${version} as '${heading#*— }'."
            exit 1 ;;
        esac

        awk -v want="## ${version} " 'index($0, want)==1 {g=1; next} g && /^## / {exit} g {print}' \
          "${file}" > notes.md
        if [ ! -s notes.md ]; then
          echo "::error::the ${version} section of ${file} is empty"
          exit 1
        fi
        echo "title=${title}" >> "$GITHUB_ENV"
        echo "--- notes ---"; cat notes.md

    # -- the CLI line: a wheel, so comfyctl is usable without Docker -----------
    # One, from the one uv workspace: comfyctl, which holds `comfyctl fetch`
    # since 6.0.0 absorbed comfyfetch. It is not on PyPI.
    # Named, not --all-packages: the workspace also holds comfyrelay, which
    # ships as the mcp image, not as a wheel. comfyctl does not depend on it;
    # without it, `comfyctl relay` is a hidden command that says it is not in
    # this build.

    - uses: astral-sh/setup-uv@v10.0.1

    - name: Build the wheel
      working-directory: services
      run: |
        set -euo pipefail
        uv build --package comfyctl --wheel -o "${GITHUB_WORKSPACE}/dist"
        cd "${GITHUB_WORKSPACE}/dist"
        # Exactly this one. A new workspace member must be added here on
        # purpose, never published by accident.
        want="comfyctl-${COMFYCTL_VERSION}-py3-none-any.whl"
        got="$(find . -maxdepth 1 -name '*.whl' -printf '%f\n' | sort)"
        if [ "${got}" != "${want}" ]; then
          echo "::error::the release built ${got//$'\n'/ }; it ships only ${want}"
          exit 1
        fi
        # A URL pin is only as good as a checksum next to it -- this is what the
        # SageAttention wheels already publish, and what consumers verify.
        sha256sum ./*.whl | tee SHA256SUMS

    - name: The wheel installs and runs
      run: |
        set -euo pipefail
        # The install services/comfyctl/README.md gives: the wheel, by itself.
        run() {
          uvx --from "./dist/comfyctl-${COMFYCTL_VERSION}-py3-none-any.whl" comfyctl "$@"
        }
        for got in "$(run --version)" "$(run fetch --version)"; do
          if [ "${got}" != "${COMFYCTL_VERSION}" ]; then
            echo "::error::the wheel reports ${got}, the tag says ${COMFYCTL_VERSION}"
            exit 1
          fi
        done
        echo "wheel ok: comfyctl and comfyctl fetch report ${COMFYCTL_VERSION}"

    - uses: actions/attest-build-provenance@v4.2.2
      with:
        subject-path: dist/*.whl

    # An attestation nobody verifies is decoration. This is the selftest: if the
    # step above ever silently produced nothing, this fails the release.
    - name: The attestations verify
      run: |
        set -euo pipefail
        for whl in ./dist/*.whl; do
          gh attestation verify "${whl}" --repo "${GITHUB_REPOSITORY}"
        done

    # -- the image line: the digests, which are what consumers actually pin ----

    - name: Log in to GHCR
      uses: docker/login-action@v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Record the published image digests
      run: |
        set -euo pipefail
        # bake is the source of truth for which tags this version publishes --
        # a hand-kept list here would drift the first time a target is added.
        docker buildx bake -f docker-bake.hcl --print all 2>/dev/null \
          | jq -r '.target[].tags[]?' \
          | grep -E -- "-${IMAGE_VERSION}\$|:${IMAGE_VERSION}\$" \
          | sort -u > tags.txt

        if [ ! -s tags.txt ]; then
          echo "::error::no tag carries ${IMAGE_VERSION}; bake and the release disagree"
          exit 1
        fi

        # What is inside, stated on the artifact itself. Reading a digest list
        # and not being able to tell which ComfyUI it carries is how "0.1.0"
        # becomes a number nobody can interpret.
        {
          echo "# ComfyUI ${COMFYUI_VERSION}, packaged as ${IMAGE_VERSION}"
          echo "#"
        } > IMAGE-DIGESTS.txt

        while read -r tag; do
          digest="$(docker buildx imagetools inspect "${tag}" --format '{{.Manifest.Digest}}')"
          printf '%s@%s\n' "${tag%%:*}" "${digest}"
        done < tags.txt | tee -a IMAGE-DIGESTS.txt

        n=$(grep -c '@sha256:' IMAGE-DIGESTS.txt); declared=$(wc -l < tags.txt)
        if [ "${n}" != "${declared}" ]; then
          echo "::error::resolved ${n} digests for ${declared} tags"
          exit 1
        fi
        {
          echo ""
          echo "Contains **ComfyUI ${COMFYUI_VERSION}**. That is what is inside;"
          echo "\`${IMAGE_VERSION}\` is our packaging version. See VERSIONING.md."
          echo ""
          echo "Pin by digest:"
          echo '```'
          cat IMAGE-DIGESTS.txt
          echo '```'
        } >> notes.md

    - name: Create the release
      run: |
        set -euo pipefail
        assets=""
        if [ -d dist ]; then assets="dist/comfyctl-${COMFYCTL_VERSION}-py3-none-any.whl dist/SHA256SUMS"; fi
        if [ -f IMAGE-DIGESTS.txt ]; then assets="${assets} IMAGE-DIGESTS.txt"; fi
        # shellcheck disable=SC2086
        gh release create "${tag}" ${assets} --title "${title}" --notes-file notes.md --verify-tag
        gh release view "${tag}" --json assets --jq '.assets[].name' | sed 's/^/published asset: /'

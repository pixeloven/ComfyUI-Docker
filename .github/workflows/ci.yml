name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild without cache'
        required: false
        type: boolean
        default: false

jobs:
  validate-examples:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Validate Example Configurations
      run: |
        for example in core-cpu core-gpu complete-gpu core-amd core-intel; do
          echo "Validating examples/$example..."
          cd examples/$example
          # Create temporary .env for validation
          cp .env.example .env
          docker compose config --quiet
          cd ../..
        done

  test-bake-targets:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Test Docker Bake targets
      run: |
        # Validate all expected targets exist in docker-bake.hcl
        docker buildx bake --file docker-bake.hcl --print | grep -q "core-cpu"
        docker buildx bake --file docker-bake.hcl --print | grep -q "core-cuda"
        docker buildx bake --file docker-bake.hcl --print | grep -q "runtime-cpu"
        docker buildx bake --file docker-bake.hcl --print | grep -q "runtime-cuda"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda-sm80"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda-sm86"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda-sm89"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda-sm90"
        docker buildx bake --file docker-bake.hcl --print | grep -q "complete-cuda-sm120"
        docker buildx bake --file docker-bake.hcl --print | grep -q "core-rocm"
        docker buildx bake --file docker-bake.hcl --print | grep -q "core-xpu"
        docker buildx bake --file docker-bake.hcl --print | grep -q "mcp"
        docker buildx bake --file docker-bake.hcl --print | grep -q "fetch"

  validate-models:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install yq 4.47.1
      # The same version the fetch image pins. yq changed how it renders "\t"
      # in an expression between 4.47 and 4.53 -- the older one emits it
      # literally -- so a gate on a different version is a gate on different
      # behaviour.
      run: |
        sudo curl -fsSL --retry 3 -o /usr/local/bin/yq \
          https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64
        sudo chmod 0555 /usr/local/bin/yq
        yq --version

    - name: Shellcheck the fetch scripts
      run: |
        sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
        shellcheck --shell=sh services/fetch/*.sh

    - name: Validate every package against the schema
      run: |
        pipx install check-jsonschema
        for f in models/packages/*.yaml; do
          if [ "$(yq -r 'has("package")' "$f")" = "true" ]; then
            echo "checking $f"
            check-jsonschema --schemafile models/packages/package.schema.json "$f"
          fi
        done

    - name: comfy-lock.yaml is generated, not hand-edited
      # comfy-lock is the lossy projection of the packages. If someone edits it
      # directly the sha256 in the package no longer describes what a fetch
      # actually pulls, which is the whole property this repository adds.
      run: |
        sh services/fetch/emit-comfy-lock.sh models/packages > /tmp/emitted.yaml
        yq -o=json -I0 '[.models[] | {"m":.model,"u":.url,"p":[.paths[].path]}] | sort_by(.p[0])' \
          comfy-lock.yaml > /tmp/committed.json
        yq -o=json -I0 '[.models[] | {"m":.model,"u":.url,"p":[.paths[].path]}] | sort_by(.p[0])' \
          /tmp/emitted.yaml > /tmp/emitted.json
        if ! diff -u /tmp/committed.json /tmp/emitted.json; then
          echo ""
          echo "comfy-lock.yaml has drifted from models/packages/."
          echo "Regenerate it rather than editing it by hand:"
          echo "  sh services/fetch/emit-comfy-lock.sh models/packages > /tmp/m.yaml"
          echo "  yq -i '.models = load(\"/tmp/m.yaml\").models' comfy-lock.yaml"
          exit 1
        fi
        echo "comfy-lock.yaml matches the packages"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build the fetch image
      uses: docker/bake-action@v7
      with:
        files: docker-bake.hcl
        targets: fetch
        load: true
        push: false
      env:
        REGISTRY_URL: ghcr.io/pixeloven/comfyui/
        IMAGE_LABEL: ci

    - name: Verify — it actually fetches, and actually rejects
      # A real fetch, not a --help probe: a fetcher whose build check is
      # `--help` proves nothing about fetching. The script is piped in over
      # stdin rather than bind-mounted so this works on any runner topology,
      # including DinD where the job's filesystem is not the Docker host's.
      run: |
        docker run --rm -i --entrypoint sh \
          ghcr.io/pixeloven/comfyui/fetch:ci -s < services/fetch/verify.sh

  build-cuda:
    runs-on: ubuntu-latest
    needs: [validate-examples, test-bake-targets, validate-models]
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7
    
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clean Docker Images
      run: |
        echo "🧹 Removing Docker system..."
        sudo docker system prune -af --volumes || true
        echo "✅ Docker system cleaned"
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        buildkitd-flags: --debug
  
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Clear GitHub Actions cache (if force rebuild)
      if: github.event.inputs.force_rebuild == 'true'
      run: |
        echo "🧹 Clearing GitHub Actions cache..."
        gh cache delete --all || true
        echo "✅ Cache cleared"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Extract metadata
      id: meta
      run: |
        echo "commit_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
        echo "commit_ref=${GITHUB_SHA}" >> $GITHUB_OUTPUT
        echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        echo "repository_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | sed 's/-docker//')" >> $GITHUB_OUTPUT
        echo "comfyui_version=$(gh api repos/Comfy-Org/ComfyUI/releases/latest --jq .tag_name)" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Build CUDA images
      uses: docker/bake-action@v7
      with:
        files: docker-bake.hcl
        targets: cuda
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        set: |
          *.cache-from=type=gha
          *.cache-to=type=gha,mode=max
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ghcr.io/${{ steps.meta.outputs.repository_lower }}/
        IMAGE_LABEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.meta.outputs.commit_sha || 'latest' }}
        COMFYUI_VERSION: ${{ steps.meta.outputs.comfyui_version }}
        PUBLISH_LATEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  build-cuda-arch:
    runs-on: ubuntu-latest
    needs: build-cuda
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        buildkitd-flags: --debug

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: |
        echo "commit_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
        echo "repository_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | sed 's/-docker//')" >> $GITHUB_OUTPUT
        echo "comfyui_version=$(gh api repos/Comfy-Org/ComfyUI/releases/latest --jq .tag_name)" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Build architecture-specific CUDA images
      uses: docker/bake-action@v7
      with:
        files: docker-bake.hcl
        targets: cuda-arch
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        set: |
          *.cache-from=type=gha
          *.cache-to=type=gha,mode=max
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ghcr.io/${{ steps.meta.outputs.repository_lower }}/
        IMAGE_LABEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.meta.outputs.commit_sha || 'latest' }}
        COMFYUI_VERSION: ${{ steps.meta.outputs.comfyui_version }}
        PUBLISH_LATEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  build-cpu:
    runs-on: ubuntu-latest
    needs: [validate-examples, test-bake-targets, validate-models]
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7
    
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clean Docker Images
      run: |
        echo "🧹 Removing Docker system..."
        sudo docker system prune -af --volumes || true
        echo "✅ Docker system cleaned"
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        buildkitd-flags: --debug
  
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: |
        echo "commit_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
        echo "commit_ref=${GITHUB_SHA}" >> $GITHUB_OUTPUT
        echo "branch=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        echo "repository_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | sed 's/-docker//')" >> $GITHUB_OUTPUT
        echo "comfyui_version=$(gh api repos/Comfy-Org/ComfyUI/releases/latest --jq .tag_name)" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Build CPU images
      uses: docker/bake-action@v7
      with:
        files: docker-bake.hcl
        targets: cpu
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        set: |
          *.cache-from=type=gha
          *.cache-to=type=gha,mode=max
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ghcr.io/${{ steps.meta.outputs.repository_lower }}/
        IMAGE_LABEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.meta.outputs.commit_sha || 'latest' }}
        COMFYUI_VERSION: ${{ steps.meta.outputs.comfyui_version }}
        PUBLISH_LATEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  build-linux-accelerators:
    runs-on: ubuntu-latest
    needs: [validate-examples, test-bake-targets, validate-models]
    strategy:
      fail-fast: false
      matrix:
        target: [rocm, xpu]
    env:
      REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v7

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      run: |
        echo "commit_sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
        echo "repository_lower=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]' | sed 's/-docker//')" >> $GITHUB_OUTPUT
        echo "comfyui_version=$(gh api repos/Comfy-Org/ComfyUI/releases/latest --jq .tag_name)" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Build ${{ matrix.target }} images
      uses: docker/bake-action@v7
      with:
        files: docker-bake.hcl
        targets: ${{ matrix.target }}
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
        set: |
          *.cache-from=type=gha,scope=${{ matrix.target }}
          *.cache-to=type=gha,mode=max,scope=${{ matrix.target }}
        provenance: false
        sbom: false
      env:
        REGISTRY_URL: ghcr.io/${{ steps.meta.outputs.repository_lower }}/
        IMAGE_LABEL: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.meta.outputs.commit_sha || 'latest' }}
        COMFYUI_VERSION: ${{ steps.meta.outputs.comfyui_version }}
        PUBLISH_LATEST: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

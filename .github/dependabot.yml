# SHA-pinned actions do not update themselves, and an unattended pin is a stale
# pin. This is what makes pinning sustainable rather than a one-time gesture.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # comfyctl and comfyfetch are published as wheels and an image consumers pin
  # by digest, so their dependency updates are release-relevant, not
  # housekeeping. `uv` rather than `pip`: it reads the workspace root and
  # updates services/uv.lock, the one lock both members share, where `pip` on
  # one member saw neither the other member nor the lock.
  - package-ecosystem: uv
    directory: /services
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

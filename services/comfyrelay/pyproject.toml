[project]
name = "comfyrelay"
version = "5.2.0"
description = "comfyrelay: an MCP sidecar for one ComfyUI instance, with capability profiles"
readme = "README.md"
requires-python = ">=3.11"
# mcp is pinned EXACTLY: tool registration, elicitation and the streamable-HTTP
# transport are all the SDK's, and its 2.x minors have changed what a tool
# error looks like to the client (tests/agent-tasks/README.md, finding 2).
# httpx2 is the SDK's own HTTP client; the ComfyUI client and the probe use it
# too, so the relay carries one HTTP stack. uvicorn serves the SDK's ASGI app.
# Both come with mcp anyway; they are named because this package imports them.
# uv.lock fixes every version.
dependencies = ["mcp==2.2.0", "httpx2>=2.5", "uvicorn>=0.31.1", "typer>=0.27.3"]

# UI-to-API conversion (#167) drives the instance's own frontend in headless
# Chromium, so it needs Playwright. Only the mcp-convert image installs it
# (built with RELAY_CONVERT=1); the mcp image does not. Pinned EXACTLY: the
# Playwright version decides the Chromium build `playwright install` fetches,
# and dockerfile.comfy.relay checks that build's revision and hash.
[project.optional-dependencies]
convert = ["playwright==1.63.0"]

# Not a wheel: comfyrelay ships as the mcp image (#136), and the release builds
# only the comfyctl wheel. No console script either: the command is `comfyctl relay`, which mounts
# `comfyrelay.cli.app` as a group when this package is installed.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["comfyrelay*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

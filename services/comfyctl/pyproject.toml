[project]
name = "comfyctl"
version = "4.0.0"
description = "One command for ComfyUI-Docker's tooling: comfyctl fetch, and more groups to come"
readme = "README.md"
requires-python = ">=3.11"
# Pinned EXACTLY. `comfyctl fetch` mounts comfyfetch's own Typer app, so the two
# ship as a pair from one release. comfyfetch is not on PyPI; see the README
# for installing both wheels together.
dependencies = ["comfyfetch==4.0.0", "typer>=0.12.5"]

[dependency-groups]
dev = ["pytest>=8.0"]

# NOT `comfy`/`comfy-cli`/`comfycli`: comfy-cli owns those, and shadowing them
# on a user's PATH would be hostile.
[project.scripts]
comfyctl = "comfyctl.cli:main"

[tool.uv.sources]
comfyfetch = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["comfyctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

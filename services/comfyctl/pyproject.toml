[project]
name = "comfyctl"
version = "5.2.0"
description = "One command for ComfyUI-Docker's tooling: comfyctl fetch, and more groups to come"
readme = "README.md"
requires-python = ">=3.11"
# `comfyctl fetch` lives in this package (comfyctl.fetch) since 6.0.0, which
# absorbed comfyfetch: one wheel, and no first-party dependency for an
# installer to look up on an index.
dependencies = ["PyYAML>=6.0", "typer>=0.27.3", "httpx>=0.27", "jsonschema>=4.20"]

[dependency-groups]
dev = ["pytest>=8.0", "respx>=0.21"]

# NOT `comfy`/`comfy-cli`/`comfycli`: comfy-cli owns those, and shadowing them
# on a user's PATH would be hostile.
[project.scripts]
comfyctl = "comfyctl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["comfyctl*"]

# The schemas ship WITH the package. A consumer running `uvx … comfyctl` has no
# checkout to point check-jsonschema at, which is the only reason some of them
# kept one.
[tool.setuptools.package-data]
"comfyctl.fetch.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

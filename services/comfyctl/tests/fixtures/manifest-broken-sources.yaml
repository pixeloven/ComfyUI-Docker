# Two distinct failure modes at once. resolve must report BOTH in a single pass
# and write no lock. A direct URL without sha256 is no longer one of them: the
# schema refuses it before anything resolves (#230).
name: broken-sources
models:
  - name: dead-civitai
    files:
      - source: civitai:2068000        # 404 — version deleted upstream
        as: gone.safetensors
        install: models/unet/
  - name: missing-repo
    files:
      - source: hf:does-not-exist-xyz/nope
        file: nope.safetensors
        install: models/loras/

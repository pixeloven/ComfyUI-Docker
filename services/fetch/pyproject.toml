[project]
name = "comfyfetch"
version = "0.1.0"
description = "Resolve, verify and materialise ComfyUI model locks"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

# The names consumers already invoke. Harmony's Jobs and the compose examples
# pass arguments positionally against the image ENTRYPOINT, so keeping these
# exact means the port changes nothing for them but the digest.
[project.scripts]
comfy-fetch = "comfyfetch.fetch:main"
comfy-resolve = "comfyfetch.resolve:main"
comfy-check-lock = "comfyfetch.check:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["comfyfetch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: hits real hosts on purpose"]

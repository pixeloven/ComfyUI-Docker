[project]
name = "comfyfetch"
version = "1.0.0"
description = "Resolve, verify and materialise ComfyUI model locks"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "typer>=0.12.5"]

# One binary, three verbs. NOT `comfy`/`comfy-cli`/`comfycli` -- comfy-cli owns
# those and shadowing them on a user's PATH would be hostile.
[project.scripts]
comfyfetch = "comfyfetch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["comfyfetch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: hits real hosts on purpose"]

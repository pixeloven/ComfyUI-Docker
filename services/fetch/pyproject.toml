[project]
name = "comfyfetch"
version = "2.4.2"
description = "Resolve, verify and materialise ComfyUI model locks"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "typer>=0.12.5", "httpx>=0.27", "jsonschema>=4.20"]

# Tests are a dependency of a project that has 73 of them. They were not
# declared, so running them meant `uv run --with pytest --with respx`, which is
# a step that gets typed wrong or skipped. `uv run pytest` now works.
[dependency-groups]
dev = ["pytest>=8.0", "respx>=0.21"]

# One binary, four verbs. NOT `comfy`/`comfy-cli`/`comfycli` -- comfy-cli owns
# those and shadowing them on a user's PATH would be hostile.
[project.scripts]
comfyfetch = "comfyfetch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["comfyfetch*"]

# The schemas ship WITH the package. A consumer running `uvx comfyfetch` has no
# checkout to point check-jsonschema at, which is the only reason some of them
# kept one.
[tool.setuptools.package-data]
"comfyfetch.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: hits real hosts on purpose"]
